<!doctype html>
<html>
<head>
<style>
  #g { display: grid; grid-template-columns: 100px 100px 100px; width: 600px; }
  #g div { height: 40px; }
  #a { grid-column: span 2; }
</style>
</head>
<body>
  <section id="g">
    <div id="a">A</div>
    <div id="b">B</div>
    <div id="c">C</div>
  </section>
</body>
</html>
