<!doctype html>
<html>
<head>
  <title>typography generics</title>
  <style>
    body { margin: 0; padding: 8px; background: #ffffff; font-size: 16px; }
    p { margin: 4px 0; }
    .serif { font-family: serif; }
    .sans { font-family: sans-serif; }
    .mono { font-family: monospace; }
    .default { }
    .stack-serif { font-family: "NoSuchFont XYZ", serif; }
    .stack-sans { font-family: "NoSuchFont XYZ", sans-serif; }
    .stack-mono { font-family: "NoSuchFont XYZ", monospace; }
  </style>
</head>
<body>
  <p class="serif">Hamburgefonstiv 123</p>
  <p class="sans">Hamburgefonstiv 123</p>
  <p class="mono">Hamburgefonstiv 123</p>
  <p class="default">Hamburgefonstiv 123</p>
  <p class="stack-serif">Hamburgefonstiv 123</p>
  <p class="stack-sans">Hamburgefonstiv 123</p>
  <p class="stack-mono">Hamburgefonstiv 123</p>
</body>
</html>
