<!doctype html>
<html>
<head>
<style>
  .row {
    display: flex;
    width: 600px;
    height: 100px;
  }
  .row div {
    width: 100px;
  }
  #stretch {
    align-items: stretch;
  }
  #center {
    align-items: center;
  }
  #start {
    align-items: flex-start;
  }
</style>
</head>
<body>
  <div id="stretch" class="row">
    <div id="sa">A</div>
  </div>
  <div id="center" class="row">
    <div id="ca">A</div>
  </div>
  <div id="start" class="row">
    <div id="ta">A</div>
  </div>
</body>
</html>
