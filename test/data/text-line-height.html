<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>line height</title>
  <style>
    body { margin: 0; font-family: monospace; font-size: 16px; }
    p { margin: 0; padding: 0; width: 300px; }
    .tight { line-height: 1; }
    .loose { line-height: 2; }
  </style>
</head>
<body>
  <p class="tight">alpha beta gamma</p>
  <p class="loose">alpha beta gamma</p>
</body>
</html>
