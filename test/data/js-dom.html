<!doctype html>
<html>
<head>
  <title>QuickJS + Blitz</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #f6f7f9; color: #222; }
    #root { padding: 24px; }
    h1 { color: #0b5; margin: 0 0 12px; }
    p { background: white; padding: 12px 16px; border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const root = document.getElementById("root");
    console.log("root found:", !!root, "body:", !!document.body);

    const title = document.createElement("h1");
    title.textContent = "QuickJS + Blitz";
    root.appendChild(title);

    const card = document.createElement("p");
    card.setAttribute("style", "color: #0a5");
    card.textContent = "Este nodo lo creó QuickJS y lo pintó Blitz.";
    document.body.appendChild(card);
  </script>
</body>
</html>
