<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>letter spacing</title>
  <style>
    body { margin: 0; font-family: monospace; font-size: 16px; }
    p { margin: 0; padding: 0; width: 600px; }
    .spaced { letter-spacing: 5px; }
  </style>
</head>
<body>
  <p class="plain" id="plain">letter spacing changes the line width</p>
  <p class="spaced" id="spaced">letter spacing changes the line width</p>
</body>
</html>
