<!doctype html>
<html>
<head>
  <title>typography mono</title>
  <style>
    body { margin: 0; padding: 8px; background: #ffffff; font-size: 16px; }
    p { margin: 4px 0; }
    .explicit { font-family: monospace; }
    .stack { font-family: "NoSuchFont XYZ", monospace; }
    .sans { font-family: sans-serif; }
  </style>
</head>
<body>
  <p class="explicit">Mono bar 123</p>
  <p class="stack">Mono bar 123</p>
  <p class="sans">Mono bar 123</p>
  <pre>Mono bar 123</pre>
  <p class="inline-code"><code>Mono bar 123</code></p>
</body>
</html>
