<!doctype html>
<title>border radius</title>
<style>
  .box {
    width: 200px;
    height: 80px;
    margin: 10px;
    background: red;
    border-radius: 20px;
  }
  .ring {
    width: 200px;
    height: 80px;
    margin: 10px;
    background: white;
    border: 6px solid blue;
    border-radius: 20px;
  }
  .circle {
    width: 100px;
    height: 100px;
    margin: 10px;
    background: red;
    border-radius: 50%;
  }
</style>
<body>
  <div class="box"></div>
  <div class="ring"></div>
  <div class="circle"></div>
</body>
