<!doctype html>
<html>
<head>
  <title>probe font weights</title>
  <style>
    body { margin: 0; padding: 8px; background: #ffffff; }
    h1 { font-size: 18px; margin: 4px 0 8px; }
    p { margin: 4px 0; font-size: 24px; font-family: "JetBrains Mono"; }
    .w300 { font-weight: 300; }
    .w400 { font-weight: 400; }
    .w500 { font-weight: 500; }
    .w700 { font-weight: 700; }
    .w900 { font-weight: 900; }
    .italic { font-style: italic; }
    .bolditalic { font-weight: 700; font-style: italic; }
  </style>
</head>
<body>
  <h1>font-weight and font-style</h1>
  <p class="w300">weight 300 thin</p>
  <p class="w400">weight 400 regular</p>
  <p class="w500">weight 500 medium</p>
  <p class="w700">weight 700 bold</p>
  <p class="w900">weight 900 black</p>
  <p class="italic">italic oblique</p>
  <p class="bolditalic">bold italic</p>
</body>
</html>
