<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>css typography</title>
  <style>
    body { margin: 0; }
    h1 {
      font-family: "T2 Mono", monospace;
      font-size: 28px;
      font-weight: 800;
      font-style: normal;
      line-height: 1.5;
      text-align: center;
      letter-spacing: 2px;
    }
    p.largo {
      font-family: serif;
      font-size: 16px;
      font-weight: 300;
      font-style: italic;
      line-height: 1.8;
      text-align: justify;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <h1>centered heading</h1>
  <p class="largo">justified body copy</p>
</body>
</html>
