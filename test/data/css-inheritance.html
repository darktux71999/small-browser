<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>css inheritance</title>
  <style>
    body { color: #222222; font-size: 20px; font-family: serif; line-height: 2; margin: 0; }
    .nivel1 { color: #0044aa; }
    .nivel2 { font-size: 1.5em; }
    .nivel3 { font-size: 50%; font-weight: 700; }
  </style>
</head>
<body>
  <div class="nivel1">
    <div class="nivel2">
      <div class="nivel3">inherited colour and typography</div>
    </div>
  </div>
</body>
</html>
