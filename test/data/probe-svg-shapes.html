<!doctype html>
<html>
<head>
  <title>probe svg shapes</title>
  <style>
    body { margin: 0; background: #ffffff; font-family: sans-serif; }
    h1 { font-size: 20px; margin: 8px; }
  </style>
</head>
<body>
  <h1>inline svg: basic shapes</h1>
  <svg width="480" height="240" viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="10" width="120" height="80" fill="#d33" />
    <circle cx="220" cy="50" r="40" fill="#3a3" />
    <ellipse cx="380" cy="50" rx="60" ry="30" fill="#36c" />
    <line x1="10" y1="120" x2="470" y2="120" stroke="#333" stroke-width="4" />
    <polygon points="40,220 90,140 140,220" fill="#e90" />
    <rect x="200" y="150" width="100" height="70" fill="none" stroke="#909" stroke-width="6" />
  </svg>
</body>
</html>
