<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>wrap</title>
  <style>
    body { margin: 0; font-family: monospace; font-size: 16px; }
    #narrow { width: 180px; }
    p { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="narrow">
    <p id="words">wrapping text must never cross the right edge of its content box even when the words are wide enough to overflow a character count estimate</p>
    <p id="longword">https://example.com/a/very/long/path/that/does/not/fit/in/one/line/at/all</p>
  </div>
</body>
</html>
