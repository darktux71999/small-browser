<!doctype html>
<html>
<head>
<style>
  .row {
    display: flex;
    width: 600px;
  }
  .row div {
    width: 100px;
    height: 40px;
  }
  #center {
    justify-content: center;
  }
  #end {
    justify-content: flex-end;
  }
  #between {
    justify-content: space-between;
  }
</style>
</head>
<body>
  <div id="center" class="row">
    <div id="ca">A</div>
    <div id="cb">B</div>
    <div id="cc">C</div>
  </div>
  <div id="end" class="row">
    <div id="ea">A</div>
    <div id="eb">B</div>
    <div id="ec">C</div>
  </div>
  <div id="between" class="row">
    <div id="ba">A</div>
    <div id="bb">B</div>
    <div id="bc">C</div>
  </div>
</body>
</html>
