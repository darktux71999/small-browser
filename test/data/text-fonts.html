<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>fonts</title>
  <style>
    body { margin: 0; font-family: "NoSuchFontXYZ", "JetBrains Mono", monospace; font-size: 20px; }
    p { margin: 0; padding: 0; width: 600px; }
    .normal { font-weight: 400; font-style: normal; }
    .bold { font-weight: 700; }
    .italic { font-style: italic; }
    .serif { font-family: serif; }
  </style>
</head>
<body>
  <p class="normal" id="normal">font rendering probe</p>
  <p class="bold" id="bold">font rendering probe</p>
  <p class="italic" id="italic">font rendering probe</p>
  <p class="serif" id="serif">font rendering probe</p>
</body>
</html>
