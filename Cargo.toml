[package]
name = "browser-lite"
version = "0.1.0"
edition = "2021"

[lib]
# This environment has no rustdoc component; there are no doc examples.
doctest = false

[dependencies]
cairo-rs = { version = "0.22", features = ["png"] }
curl = "0.4"
url = "2"
winit = "0.30.2"
rusqlite = { version = "0.40", default-features = false, features = ["modern_sqlite"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
