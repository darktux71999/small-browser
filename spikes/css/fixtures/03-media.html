<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Media queries</title>
  <style>
    body { margin: 0; padding: 4px; }
    .base {
      background: #ffffff;
      color: #000000;
      font-size: 14px;
      padding: 6px;
      margin: 6px;
    }
    @media screen {
      .base { color: #0033cc; }
    }
    @media print {
      .base { color: #cc0000; }
    }
    @media (min-width: 100px) {
      .base { background: #ffffcc; font-size: 18px; }
    }
    @media (min-width: 10000px) {
      .base { background: #000000; }
    }
  </style>
</head>
<body>
  <div class="base" id="base">
    En pantalla con 800px de ancho esto debe salir azul (#0033cc) sobre fondo
    amarillo pálido (#ffffcc) a 18px; la regla print y la de min-width 10000px
    no deben aplicar.
  </div>
</body>
</html>
